name: Build PDFs

on:
  push:
    branches:
      - main

jobs:
  build_latex:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
          
      - name: CV kompilieren
        uses: xu-cheng/latex-action@v3
        with:
          root_file: src/cv.tex
          latexmk_use_xelatex: true
          args: -output-directory=build

      - name: Vergleichsdokument kompilieren
        uses: xu-cheng/latex-action@v3
        with:
          root_file: docs/document-comparison.tex
          latexmk_use_xelatex: true
          args: -output-directory=build 
          
      - name: PDFs hochladen
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdfs
          path: build/*.pdf
